server:
  port: 8080

spring:
  application:
    name: gateway-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: ${services.identity.url}
          predicates:
            - Path=/auth/**

        - id: catalog-service
          uri: ${services.catalog.url}
          predicates:
            - Path=/books/**
          filters:
            - AuthenticationFilter

        - id: order-service
          uri: ${services.order.url}
          predicates:
            - Path=/orders/**
          filters:
            - AuthenticationFilter

        - id: identity-service-openapi
          uri: ${services.identity.url}
          predicates:
            - Path=/identity-service/v3/api-docs
          filters:
            - RewritePath=/identity-service/(?<segment>.*), /$\1

        - id: catalog-service-openapi
          uri: ${services.catalog.url}
          predicates:
            - Path=/catalog-service/v3/api-docs
          filters:
            - RewritePath=/catalog-service/(?<segment>.*), /$\1

        - id: order-service-openapi
          uri: ${services.order.url}
          predicates:
            - Path=/order-service/v3/api-docs
          filters:
            - RewritePath=/order-service/(?<segment>.*), /$\1

        - id: payment-service-openapi
          uri: ${services.payment.url}
          predicates:
            - Path=/payment-service/v3/api-docs
          filters:
            - RewritePath=/payment-service/(?<segment>.*), /$\1

        - id: notification-service-openapi
          uri: ${services.notification.url}
          predicates:
            - Path=/notification-service/v3/api-docs
          filters:
            - RewritePath=/notification-service/(?<segment>.*), /$\1

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: 1.0

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    urls:
      - name: Identity Service
        url: /identity-service/v3/api-docs

      - name: Catalog Service
        url: /catalog-service/v3/api-docs

      - name: Order Service
        url: /order-service/v3/api-docs

      - name: Payment Service
        url: /payment-service/v3/api-docs

      - name: Notification Service
        url: /notification-service/v3/api-docs

