name: Publish Gateway Service Image

on:
  workflow_run:
    workflows:
      - Gateway Service CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: gateway-service-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sc4rlxrd/gateway-service

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 45

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master'

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Prepare image metadata
        id: metadata
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          echo "short_sha=${HEAD_SHA::7}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile

          platforms: |
            linux/amd64
            linux/arm64

          push: true

          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:master
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.metadata.outputs.short_sha }}

          labels: |
            org.opencontainers.image.title=gateway-service
            org.opencontainers.image.description=BookCommerce gateway-service
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=sha-${{ steps.metadata.outputs.short_sha }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            org.opencontainers.image.vendor=Sc4rlxrd

          build-args: |
            APP_NAME=gateway-service
            APP_VERSION=sha-${{ steps.metadata.outputs.short_sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            VCS_REF=${{ github.event.workflow_run.head_sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}

          cache-from: type=gha,scope=gateway-service
          cache-to: type=gha,mode=max,scope=gateway-service

          provenance: mode=max
          sbom: true